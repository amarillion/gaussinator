<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Logo for the RREF row-reduction game.

    A 3x3 matrix (already in reduced row echelon form) with the middle
    row highlighted and nudged to the right, echoing the game's "lift a
    row to the right and add it to another row" move.

    The SVG only uses plain filled shapes (no gradients, filters, or
    stroked open paths) so it rasterizes cleanly with ImageMagick, which
    is what the makefile in this directory uses to produce the PWA icons.
  -->
  <defs>
    <clipPath id="icon">
      <rect x="8" y="8" width="496" height="496" rx="112"/>
    </clipPath>
  </defs>

  <!-- app-icon background: theme pink with a soft top-left sheen -->
  <g clip-path="url(#icon)">
    <rect x="0" y="0" width="512" height="512" fill="#f33061"/>
    <circle cx="120" cy="88" r="240" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- soft light pooling behind the matrix so it separates from the background -->
  <ellipse cx="256" cy="256" rx="206" ry="196" fill="#ffffff" opacity="0.08"/>

  <!-- matrix brackets: solid white [ ] built from filled rounded rects -->
  <g fill="#ffffff">
    <!-- left bracket -->
    <rect x="55" y="79" width="18" height="354" rx="9"/>
    <rect x="55" y="79" width="55" height="18" rx="9"/>
    <rect x="55" y="415" width="55" height="18" rx="9"/>
    <!-- right bracket -->
    <rect x="439" y="79" width="18" height="354" rx="9"/>
    <rect x="402" y="79" width="55" height="18" rx="9"/>
    <rect x="402" y="415" width="55" height="18" rx="9"/>
  </g>

  <!-- top row: 1  0  2 -->
  <g font-family="DejaVu Sans" font-size="54" font-weight="700" text-anchor="middle">
    <rect x="102" y="102" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="148" y="167" fill="#776e65">1</text>
    <rect x="210" y="102" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="256" y="167" fill="#8a8072">0</text>
    <rect x="318" y="102" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="364" y="167" fill="#776e65">2</text>

    <!-- bottom row: 0  0  0 -->
    <rect x="102" y="318" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="148" y="383" fill="#8a8072">0</text>
    <rect x="210" y="318" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="256" y="383" fill="#8a8072">0</text>
    <rect x="318" y="318" width="92" height="92" rx="18" fill="#faf8ef"/>
    <text x="364" y="383" fill="#8a8072">0</text>
  </g>

  <!-- soft shadow cast by the lifted row onto the row below -->
  <rect x="132" y="304" width="296" height="16" rx="8" fill="#7a1028" opacity="0.18"/>

  <!-- lifted middle row: 0  1  -3, highlighted and offset to the right -->
  <g font-family="DejaVu Sans" font-size="54" font-weight="700" text-anchor="middle">
    <rect x="126" y="210" width="92" height="92" rx="18" fill="#3c3a32" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>
    <text x="172" y="275" fill="#ffffff">0</text>
    <rect x="234" y="210" width="92" height="92" rx="18" fill="#3c3a32" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>
    <text x="280" y="275" fill="#ffffff">1</text>
    <rect x="342" y="210" width="92" height="92" rx="18" fill="#3c3a32" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>
    <text x="388" y="275" fill="#ffffff">-3</text>
  </g>
</svg>
